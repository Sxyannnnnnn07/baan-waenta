<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ | บ้านแว่นตา (Baan Waenta)</title>
    <!-- Google Fonts Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="บ้านแว่นตา">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            background: radial-gradient(circle at 10% 20%, rgba(0, 0, 0, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 0, 0, 0.03) 0%, transparent 40%),
                        var(--bg-primary);
        }

        [data-theme="dark"] .login-wrapper {
            background: radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 40%),
                        var(--bg-primary);
        }

        .login-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 460px;
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: cardFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.5rem;
        }

        .login-brand span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 1.1rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Mode Switcher Tabs */
        .auth-tabs {
            display: flex;
            background-color: var(--accent-light);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 1.8rem;
            position: relative;
        }

        .auth-tab-btn {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 10px;
            transition: var(--transition);
        }

        .auth-tab-btn.active {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Form Controls */
        .form-floating-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-floating-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .input-with-icon > ion-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: var(--text-secondary);
            pointer-events: none;
            z-index: 2;
        }

        .input-with-icon input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
        }

        .input-with-icon input:focus {
            border-color: var(--accent);
            background-color: var(--bg-secondary);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] .input-with-icon input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 5;
            border-radius: 6px;
        }

        .password-toggle-btn ion-icon {
            position: static !important;
            transform: none !important;
            font-size: 1.25rem !important;
            color: var(--text-secondary);
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.25rem;
                border-radius: 20px;
            }
            .login-top-bar {
                top: 1rem;
                left: 1rem;
                right: 1rem;
            }
        }

        /* Social Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-divider span {
            padding: 0 1rem;
        }

        /* Google Sign-in Button */
        .google-auth-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.8rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .google-auth-btn:hover {
            background-color: var(--accent-light);
            border-color: var(--text-secondary);
        }

        .google-auth-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Guest Entry Link */
        .guest-entry-container {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px dashed var(--border-color);
            text-align: center;
        }

        .guest-entry-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }

        .guest-entry-btn:hover {
            color: var(--text-primary);
            transform: translateX(3px);
        }

        /* Top Theme & Home Bar */
        .login-top-bar {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            right: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .login-top-btn {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 0.45rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .login-top-btn:hover {
            background-color: var(--accent-light);
            transform: translateY(-2px);
        }

        .theme-circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .theme-circle-btn:hover {
            background-color: var(--accent-light);
            transform: translateY(-2px);
        }

        /* Live Alert Notification */
        .auth-alert {
            display: none;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            text-align: left;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-alert.error {
            display: flex;
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
        }

        .auth-alert.success {
            display: flex;
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        [data-theme="dark"] .auth-alert.error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
        }

        [data-theme="dark"] .auth-alert.success {
            background-color: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border-color: rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand Header -->
            <div class="login-header">
                <a href="/" class="login-brand">
                    บ้านแว่นตา<span>.store</span>
                </a>
                <p class="login-subtitle" id="auth-subtitle">ระบบบริการร้านแว่นตาอัจฉริยะ & ลองแว่นเสมือนจริง</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login" onclick="setAuthTab('login')">
                    <ion-icon name="log-in-outline" style="vertical-align: middle; margin-right: 2px;"></ion-icon> เข้าสู่ระบบ
                </button>
                <button type="button" class="auth-tab-btn" id="tab-register" onclick="setAuthTab('register')">
                    <ion-icon name="person-add-outline" style="vertical-align: middle; margin-right: 2px;"></ion-icon> สมัครสมาชิก
                </button>
            </div>

            <!-- In-Page Alert -->
            <div class="auth-alert" id="auth-alert-box">
                <ion-icon name="alert-circle-outline" id="auth-alert-icon" style="font-size: 1.2rem; flex-shrink: 0;"></ion-icon>
                <span id="auth-alert-message"></span>
            </div>

            <!-- Auth Form -->
            <form id="auth-page-form" onsubmit="handleAuthSubmit(event)">
                <!-- Username -->
                <div class="form-floating-group">
                    <label for="auth-username" id="auth-username-label">ชื่อผู้ใช้งาน หรือ อีเมล</label>
                    <div class="input-with-icon">
                        <ion-icon name="person-outline"></ion-icon>
                        <input type="text" id="auth-username" required placeholder="กรอกชื่อผู้ใช้งาน หรือ อีเมล" autocomplete="username">
                    </div>
                </div>

                <!-- Email (Only for Registration) -->
                <div class="form-floating-group" id="email-field-group" style="display: none;">
                    <label for="auth-email">อีเมล</label>
                    <div class="input-with-icon">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="email" id="auth-email" placeholder="example@email.com" autocomplete="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-floating-group" style="margin-bottom: 0.8rem;">
                    <label for="auth-password">รหัสผ่าน</label>
                    <div class="input-with-icon">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" id="auth-password" required placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
                    </div>
                </div>

                <!-- Remember Me Checkbox -->
                <div id="remember-me-container" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; font-size: 0.88rem; color: var(--text-secondary);">
                    <label style="display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer; user-select: none; font-size: 0.88rem; color: var(--text-primary);">
                        <input type="checkbox" id="remember-me-checkbox" style="width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; border-radius: 4px;">
                        <span>จำรหัสผ่านในเครื่องนี้</span>
                    </label>
                </div>

                <!-- Password Strength Checklist (Registration Only) -->
                <div id="password-strength-container" style="display: none; margin-bottom: 1.2rem; text-align: left; background: var(--bg-primary); padding: 0.8rem; border-radius: 12px; border: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">
                        <span>ระดับความปลอดภัย:</span>
                        <span id="strength-label" style="color: var(--text-secondary);">ว่างเปล่า</span>
                    </div>
                    <div style="display: flex; gap: 4px; height: 5px; margin-bottom: 0.6rem;">
                        <div class="strength-bar" style="flex: 1; border-radius: 4px; background-color: var(--border-color); transition: background-color 0.3s ease;"></div>
                        <div class="strength-bar" style="flex: 1; border-radius: 4px; background-color: var(--border-color); transition: background-color 0.3s ease;"></div>
                        <div class="strength-bar" style="flex: 1; border-radius: 4px; background-color: var(--border-color); transition: background-color 0.3s ease;"></div>
                        <div class="strength-bar" style="flex: 1; border-radius: 4px; background-color: var(--border-color); transition: background-color 0.3s ease;"></div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.3rem;">
                        <div id="rule-length" style="display: flex; align-items: center; gap: 0.3rem;"><ion-icon name="ellipse-outline"></ion-icon> อย่างน้อย 8 ตัวอักษร</div>
                        <div id="rule-case" style="display: flex; align-items: center; gap: 0.3rem;"><ion-icon name="ellipse-outline"></ion-icon> มีตัวพิมพ์ใหญ่และพิมพ์เล็ก (A-Z, a-z)</div>
                        <div id="rule-digit-symbol" style="display: flex; align-items: center; gap: 0.3rem;"><ion-icon name="ellipse-outline"></ion-icon> มีตัวเลขหรืออักขระพิเศษ (0-9, !@#$)</div>
                    </div>
                    <div id="common-warning" style="display: none; font-size: 0.75rem; color: #ef4444; margin-top: 0.4rem;">
                        <ion-icon name="warning-outline" style="vertical-align: -1px;"></ion-icon> รหัสผ่านนี้คาดเดาง่ายเกินไป กรุณาหลีกเลี่ยง
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width: 100%; padding: 0.85rem; font-size: 1rem; border-radius: 12px; margin-top: 0.5rem; justify-content: center;">
                    <ion-icon name="log-in-outline"></ion-icon> เข้าสู่ระบบ
                </button>
            </form>

            <!-- Social Divider -->
            <div class="auth-divider">
                <span>หรือดำเนินการด้วย</span>
            </div>

            <!-- Google Auth -->
            <button type="button" class="google-auth-btn" id="auth-google-btn" onclick="handleGoogleSignIn()">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span id="google-btn-text">เข้าสู่ระบบด้วย Google</span>
            </button>

            <!-- Guest Entry -->
            <div class="guest-entry-container">
                <a href="/" class="guest-entry-btn" onclick="allowGuestMode(event)">
                    เข้าชมเว็บไซต์ร้านค้าในฐานะผู้มาเยือน <ion-icon name="arrow-forward-outline"></ion-icon>
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/login.js"></script>
</body>
</html>
